# package.json pins next, react and ts-fsrs to exact versions, so a security patch never
# arrives on its own. Dependabot is what keeps those pins from going stale.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request per ecosystem. A solo project has no review budget for fifteen
      # separate bumps.
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
