name: CI

on:
  push:
    branches: [master, zhesen]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only ever reads the repository. Without this block the job would
# inherit whatever the repository default is, which may be read-write.
permissions:
  contents: read

env:
  # Matches the `engines.node` range in package.json and the version used for
  # local development. CI and the developer machine run the same major on
  # purpose: a test that only fails on one of them is the worst kind to debug.
  NODE_VERSION: '24.x'

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Split into three steps rather than one `npm run verify` so a failure
      # names itself in the job summary. The scripts are the same ones the Stop
      # hook and a developer run, so there is one definition of each check.
      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    # The build prerenders pages that read from Supabase, so it only runs where
    # the project secrets are available. Forked pull requests skip it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Next build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  migrations:
    name: Migration hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: No duplicate migration numbers
        run: |
          cd supabase/migrations
          duplicates=$(ls *.sql | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Two migrations share a number, so their order is undefined:"
            echo "$duplicates"
            exit 1
          fi
          echo "$(ls *.sql | wc -l) migrations, all numbered uniquely."

      - name: Destructive statements are declared
        run: |
          cd supabase/migrations
          # Migrations are replayed against a database that already holds real user
          # data, so dropping or truncating has to be a deliberate, reviewed act.
          # A migration is allowed to do it, but it has to say so on its own line:
          #
          #   -- reviewed-destructive: <who approved it, and why>
          #
          # A destructive statement nobody wrote that line for fails the build. The
          # line cannot appear by accident, and it keeps the reason in the file
          # rather than in a pull request comment nobody reads again.
          pattern='^[[:space:]]*(drop[[:space:]]+(table|column|schema)|truncate|delete[[:space:]]+from)'
          status=0
          for f in *.sql; do
            grep -qiE "$pattern" "$f" || continue
            if grep -qi '^-- reviewed-destructive:' "$f"; then
              echo "$f: destructive, declared."
            else
              echo "$f: destructive and undeclared:"
              grep -niE "$pattern" "$f"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Add '-- reviewed-destructive: <reason>' to the migration, or remove the statement."
            exit 1
          fi
          echo "Every destructive statement is declared."
