name: CI

on:
  push:
    branches: [master, zhesen]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository. Without this it inherits the repository default,
# which may be read-write.
permissions:
  contents: read

env:
  # Same major as local development, so a test cannot fail on only one of them.
  NODE_VERSION: '24.x'

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Three steps rather than one `npm run verify`, so a failure names itself in the job
      # summary. The scripts are the ones the Stop hook and a developer run.
      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    # The build prerenders pages that read Supabase, so it only runs where the project
    # secrets exist. Forked pull requests skip it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Skipped, not failed, when the secrets are absent. Dependabot pull requests run in
      # this repository but receive the Dependabot secret store, so both variables arrive
      # empty and the prerender would die on "@supabase/ssr: Your project's URL and API key
      # are required to create a Supabase client!". A job that can never pass trains the
      # reviewer to merge over a red check.
      - name: Next build
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "No Supabase secrets on this run; skipping the prerender."
            exit 0
          fi
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  migrations:
    name: Migration hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: No duplicate migration numbers
        run: |
          cd supabase/migrations
          duplicates=$(ls *.sql | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Two migrations share a number, so their order is undefined:"
            echo "$duplicates"
            exit 1
          fi
          echo "$(ls *.sql | wc -l) migrations, all numbered uniquely."

      - name: Destructive statements are declared
        run: |
          cd supabase/migrations
          # Migrations replay against a database holding real user data. A destructive
          # statement is allowed, but the file must say so on its own line:
          #   -- reviewed-destructive: <who approved it, and why>
          pattern='^[[:space:]]*(drop[[:space:]]+(table|column|schema)|truncate|delete[[:space:]]+from)'
          status=0
          for f in *.sql; do
            grep -qiE "$pattern" "$f" || continue
            if grep -qi '^-- reviewed-destructive:' "$f"; then
              echo "$f: destructive, declared."
            else
              echo "$f: destructive and undeclared:"
              grep -niE "$pattern" "$f"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Add '-- reviewed-destructive: <reason>' to the migration, or remove the statement."
            exit 1
          fi
          echo "Every destructive statement is declared."

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify, build, migrations]
    # Production only, and only for a real push: a pull request must not replace what is
    # live, and a re-run of an old commit must not roll the site back.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Vercel's GitHub integration refuses these commits, because their GitHub author is not
    # a member of the Vercel team ("the commit author doesn't have permission to create
    # deployments for this project"). A token deploy is not subject to that check and puts
    # the deploy behind the tests rather than beside them.
    env:
      VERCEL_ORG_ID: team_rfK6c0vpzY7uNlCrXsnRt489
      VERCEL_PROJECT_ID: prj_7uctsKu2VekNg9E1hUI67ziDnTqT
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Skipped, not failed, when the token is absent, so a fork still gets the rest of the
      # pipeline's signal.
      - name: Deploy
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN secret; skipping the deploy."
            exit 0
          fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
